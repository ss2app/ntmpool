name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Postgres service 容器：M4 会计/打款持久层的集成测试靠它（无 DSN 时这些
    # 测试自动 t.Skip，但 CI 必须真跑，双实现 conformance + 崩溃恢复 + 多实例）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ntmpool
          POSTGRES_DB: ntmpool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NTMPOOL_PG_DSN: postgres://postgres:ntmpool@localhost:5432/ntmpool_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (算法金锚 / vardiff / CN+多币 e2e / ★Postgres 会计双实现 conformance+崩溃恢复+多实例)
        run: go test ./...
      - name: Cross-compile smoke (linux-amd64 / windows-amd64 / linux-arm64)
        run: |
          GOOS=linux  GOARCH=amd64 go build -o /dev/null ./cmd/ntmpool
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/ntmpool
          GOOS=linux  GOARCH=arm64 go build -o /dev/null ./cmd/ntmpool

  # RandomX cgo（生产 linux 二进制形态）：vendored libRandomX stock 配置（rx/0）。
  # ⚠ 必须 -DRANDOMX_STOCK：vendored configuration.h 默认是 dragonx 常量，
  # 官方向量金锚测试会拦下链错的库。
  # runner 钉 22.04：cgo 动态链 glibc，旧 runner 编的二进制向新服务器兼容（反向不行）。
  randomx:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Cache librandomx build
        uses: actions/cache@v4
        with:
          path: third_party/randomx/build-stock
          key: librandomx-stock-${{ runner.os }}-${{ hashFiles('third_party/randomx/src/**', 'third_party/randomx/CMakeLists.txt') }}
      - name: Build vendored libRandomX (stock rx/0, ARCH=default)
        run: |
          if [ ! -f third_party/randomx/build-stock/librandomx.a ]; then
            cmake -S third_party/randomx -B third_party/randomx/build-stock \
              -DARCH=default -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_C_FLAGS=-DRANDOMX_STOCK -DCMAKE_CXX_FLAGS=-DRANDOMX_STOCK
            cmake --build third_party/randomx/build-stock --target randomx -j
          fi
      - name: Build (tags randomx)
        run: go build -tags randomx ./...
      - name: Vet (tags randomx)
        run: go vet -tags randomx ./...
      - name: Test rx/0 金锚 + 全量回归 (tags randomx)
        run: go test -tags randomx ./...
      - name: Build server binary (linux-x64, tags randomx)
        run: |
          go build -tags randomx -ldflags "-s -w" -o out/ntmpool ./cmd/ntmpool
      - uses: actions/upload-artifact@v4
        with:
          name: ntmpool-linux-x64-randomx
          path: out/ntmpool
